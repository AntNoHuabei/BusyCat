<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusyCat · 动画预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:#283441;font-family:system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(860px,94vw);padding:36px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #28344130;padding-bottom:18px}.wordmark{font-size:23px;font-weight:750;letter-spacing:-1px}.tag{font-size:12px;letter-spacing:2px;color:#657267}h1{font-size:clamp(30px,5vw,52px);font-weight:550;letter-spacing:-2px;margin:36px 0 8px}p{color:#63706e;line-height:1.8;margin:0}.stage{position:relative;width:min(480px,90%);margin:0 auto}img{display:block;width:100%;image-rendering:auto}.bubble{position:absolute;left:48%;top:60%;padding:7px 12px;background:#fff9e9;border-radius:9px;box-shadow:0 3px 12px #20273315;animation:float .8s ease-out forwards;font-weight:600;pointer-events:none}@keyframes float{to{transform:translateY(-90px) rotate(6deg);opacity:0}}nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{font:inherit;border:1px solid #28344128;background:#f6f1e6;color:#283441;border-radius:30px;padding:10px 22px;cursor:pointer}button:hover{background:#c7e782;border-color:#a2bf6c}footer{margin-top:36px;padding-top:18px;border-top:1px solid #28344130;display:flex;justify-content:space-between;color:#6d7977;font-size:12px}
</style>
<main>
<header><div class="wordmark">busycat<span style="color:#779945">.</span></div><span class="tag">A LITTLE DESK COMPANY</span></header>
<h1>你忙你的，猫陪着。</h1><p>点击下方按钮，或在此页面敲键盘，看看小猫的反应。</p>
<div class="stage" id="stage"><canvas id="cat" width="512" height="512" style="width:100%;display:block" aria-label="黑猫互动预览"></canvas></div>
<nav><button data-action="left">左爪</button><button data-action="right">右爪</button><button data-action="both">双爪</button><button data-action="phone">闲置刷手机</button><button data-action="mouse">左侧鼠标</button><button id="demo">连续打字</button></nav>
<footer><span>鼠标跟随 · 五排键盘 · 闲置 15 秒刷手机</span><span>BUSYCAT / INPUT EDITION</span></footer>
</main>
<script src="keyboard-layout.js"></script>
<script src="app.js"></script>
</html>
