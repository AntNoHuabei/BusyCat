[package]
name = "busycat"
version = "0.1.0"
edition = "2024"
description = "A tiny black cat that keeps you company while you type"
license = "MIT"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[build-dependencies]
winresource = "0.1.34"
